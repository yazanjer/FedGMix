# Baseline CCVR (Luo et al., NeurIPS 2021): FedAvg + post-hoc head re-calibration (unguarded).
name: ccvr
norm: local
agg: fedavg
beta: 0.0
loss: ce
tau: 1.0
fedrs_alpha: 0.5
prox_mu: 0.0
scaffold: false
fedbn: false
pooled: false
client_momentum: null
ccvr: true
ccvr_samples: 2000
ccvr_epochs: 10
ccvr_lr: 0.1

suite: pilot_v3
# Pilot 2 (pre-registered 2026-11-01). FRESH seeds 2-3: the new components were designed after seeing seeds 0-1,
# so the go rule is evaluated on seeds not used before. References are re-run on the same GPU type.
# sfspcl_v3x_ccvr = the best of P1-P3 by tuning-seed validation macro-F1 + guarded CCVR (P4); its config is
# generated by the job after selection (scripts/make_v3x.py).
groups:
  - datasets: [ciciot2023, edgeiiot]
    labels: [fine, grouped]
    methods: [scaffold, sfspcl, sfspcl_m_ntd, sfspcl_cm, sfspcl_m_fa, sfspcl_v3x_ccvr]
    seeds: [2, 3]

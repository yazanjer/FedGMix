suite: sweep_main
# Checkpoint 3 sensitivity sweeps (pre-registered 2026-11-03, docs/SWEEP_PREREG.md). One factor at a time around the
# main setting (K = 20, alpha = 0.1, rho = 0.5, T = 50); FRESH seeds 20-24; three datasets; fine labels; run with
# +eval_shift=true. FedDyn / CCVR / FedAvgM / FedLC use the re-tuned values of checkpoint 2b (configs/tuned.yaml).
groups:
  - {datasets: [ciciot2023, edgeiiot, toniot], labels: [fine], methods: [fedmix, scaffold, feddyn, ccvr, sfspcl], seeds: [20, 21, 22, 23, 24]}
  - {datasets: [ciciot2023, edgeiiot, toniot], labels: [fine], methods: [fedmix, scaffold, feddyn, ccvr, sfspcl], seeds: [20, 21, 22, 23, 24], sweep: {federation.n_clients: [10, 50, 100]}}
  - {datasets: [ciciot2023, edgeiiot, toniot], labels: [fine], methods: [fedmix, scaffold, feddyn, ccvr, sfspcl], seeds: [20, 21, 22, 23, 24], sweep: {federation.alpha: [0.05, 0.5, 1.0]}}
  - {datasets: [ciciot2023, edgeiiot, toniot], labels: [fine], methods: [fedmix, scaffold, feddyn, ccvr, sfspcl], seeds: [20, 21, 22, 23, 24], sweep: {fl.participation: [0.2, 1.0]}}
  - {datasets: [ciciot2023, edgeiiot, toniot], labels: [fine], methods: [fedmix], seeds: [20, 21, 22, 23, 24], sweep: {method.virtual: [0.25, 0.5, 2.0]}}
